# Xndzor.com — VPS deploy (Postgres)
# 1. Copy .env.example → .env and fill secrets + NEXTAUTH_URL=https://www.xndzor.com
# 2. docker compose up -d --build
# 3. Point DNS A record to this server; terminate TLS (Caddy/nginx/Cloudflare)

services:
  db:
    image: postgres:16-alpine
    container_name: farmos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xndzor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xndzor}
      POSTGRES_DB: xndzor
    volumes:
      - farmos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xndzor -d xndzor"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: farmos
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://xndzor:${POSTGRES_PASSWORD:-xndzor}@db:5432/xndzor
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - farmos_uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/hy').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 40s

volumes:
  farmos_pg:
  farmos_uploads:
